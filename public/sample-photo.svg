    <rect x="570" y="820" width="150" height="530"/>
    <rect x="730" y="740" width="110" height="610"/>
    <rect x="850" y="880" width="230" height="470"/>
  </g>
  <rect y="1180" width="1080" height="170" fill="#1d1830"/>
</svg>
